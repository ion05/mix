name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project Mix.xcodeproj \
            -scheme Mix \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Mix.xcarchive" \
            -destination "generic/platform=macOS" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mix.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Mix.app" "$RUNNER_TEMP/Mix-notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/Mix-notarize.zip" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/export/Mix.app"

      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg_dir="$RUNNER_TEMP/dmg"
          mkdir -p "$dmg_dir"
          cp -R "$RUNNER_TEMP/export/Mix.app" "$dmg_dir/"
          ln -s /Applications "$dmg_dir/Applications"
          hdiutil create -volname "Mix" -srcfolder "$dmg_dir" -ov -format UDZO "$RUNNER_TEMP/Mix-$VERSION.dmg"
          echo "DMG_PATH=$RUNNER_TEMP/Mix-$VERSION.dmg" >> "$GITHUB_ENV"

      - name: Verify notarization ticket
        run: |
          xattr -w com.apple.quarantine "0181;00000000;Safari;" "$RUNNER_TEMP/export/Mix.app"
          spctl -a -vvv --type execute "$RUNNER_TEMP/export/Mix.app"
          xattr -d com.apple.quarantine "$RUNNER_TEMP/export/Mix.app"

      - name: Package Sparkle update
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY secret is missing, so installed copies could not verify this update}"
          zip_name="Mix-$VERSION.zip"
          zip_path="$RUNNER_TEMP/$zip_name"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/export/Mix.app" "$zip_path"

          sign_update=$(find "$RUNNER_TEMP/spm/artifacts" -type f -name sign_update -path '*/bin/*' | head -1)
          [ -x "$sign_update" ] || { echo "sign_update not found in Sparkle artifacts" >&2; exit 1; }
          key_file="$RUNNER_TEMP/sparkle_key"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file")
          signature=$("$sign_update" --ed-key-file "$key_file" "$zip_path")
          rm -f "$key_file"

          cat > "$RUNNER_TEMP/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Mix</title>
              <item>
                <title>Version $VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/$REPO/releases/tag/v$VERSION</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/$REPO/releases/download/v$VERSION/$zip_name" type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          XML
          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_ENV"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.APPCAST_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
